<div class="carousel-wrapper">

  <owl-carousel-o [options]="customOptions" (translated)="onPageChange($event)">
    <ng-container *ngFor="let page of quranPages; let id = index; trackBy: trackPage">
      <ng-template carouselSlide [id]="id + 1 + ''">
        <div class="quran-page tw-mx-3 tw-relative">
          <div class="mushaf-body" [class.mushaf-body-special]="page.pageNumber <= 2" dir="rtl">

            <!-- Mushaf Al-Madinah line view -->
            <ng-container *ngIf="page.mushafLines?.length">
              <ng-container *ngFor="let line of page.mushafLines">

                <!-- Inline sura header -->
                <div *ngIf="line.isSuraStart" class="tw-relative tw-mb-3 tw-mt-2">
                  <img src="../../../../../assets/images/head.png" class="tw-h-16 tw-w-full" alt="" />
                  <div class="tw-absolute tw-top-[4px] tw-left-0 tw-right-0">
                    <span class="tw-text-3xl">{{ line.suraName }}</span>
                  </div>
                </div>

                <!-- Mushaf line -->
                <div class="mushaf-line" [class.mushaf-line-centered]="line.isCentered">
                  <ng-container *ngFor="let seg of line.segments">
                    <ng-container *ngFor="let w of seg.lineColoredWords">
                      <span class="mushaf-word"
                        [class.highlight]="seg.aya.highlighted"
                        [style.text-decoration-line]="w.color ? 'underline' : 'none'"
                        [style.text-decoration-color]="w.color"
                        (click)="toggleHighlight(seg.aya)"
                        (contextmenu)="onRightClick($event, seg.aya)">{{ w.word }}</span>
                    </ng-container>
                    <span *ngIf="seg.isAyaEnd" class="aya-aya">{{ convertToArabicNumbers(seg.aya.ayaNumber) }}</span>
                  </ng-container>
                </div>

              </ng-container>
            </ng-container>

            <!-- Loading spinner -->
            <div *ngIf="!page.mushafLines?.length" class="tw-flex tw-justify-center tw-items-center tw-py-20">
              <div class="mushaf-spinner"></div>
            </div>

          </div>
        </div>
      </ng-template>
    </ng-container>
  </owl-carousel-o>

</div>

<!-- Page number indicator + slideshow controls -->
<div class="tw-flex tw-items-center tw-justify-center tw-gap-2 tw-mt-3 tw-mb-1" dir="rtl">

  <!-- Next page (RTL: visually right = next in mushaf) -->
  <button (click)="nextPage()" [disabled]="pageNumber >= 604"
    class="tw-flex tw-items-center tw-justify-center tw-w-8 tw-h-8 tw-rounded-full tw-bg-white tw-border tw-border-gray-200 tw-shadow-sm tw-transition-all hover:tw-bg-gray-50 hover:tw-shadow-md active:tw-scale-95 disabled:tw-opacity-30 disabled:tw-cursor-default">
    <svg xmlns="http://www.w3.org/2000/svg" class="tw-w-4 tw-h-4 tw-text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>

  <!-- Play / Pause button -->
  <button (click)="toggleSlideshow()"
    class="tw-flex tw-items-center tw-justify-center tw-w-8 tw-h-8 tw-rounded-full tw-bg-white tw-border tw-border-gray-200 tw-shadow-sm tw-transition-all hover:tw-bg-gray-50 hover:tw-shadow-md active:tw-scale-95"
    [title]="slideshowPlaying ? 'إيقاف مؤقت' : 'تشغيل العرض'">
    <svg *ngIf="slideshowPlaying" xmlns="http://www.w3.org/2000/svg"
      class="tw-w-4 tw-h-4 tw-text-gray-700" viewBox="0 0 24 24" fill="currentColor">
      <rect x="5" y="4" width="4" height="16" rx="1"/>
      <rect x="15" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg *ngIf="!slideshowPlaying" xmlns="http://www.w3.org/2000/svg"
      class="tw-w-4 tw-h-4 tw-text-gray-700" viewBox="0 0 24 24" fill="currentColor">
      <path d="M6 4l14 8-14 8V4z"/>
    </svg>
  </button>

  <!-- Page pill -->
  <div class="tw-flex tw-flex-nowrap tw-items-center tw-gap-2 tw-bg-white tw-border tw-border-gray-200 tw-rounded-full tw-shadow-sm tw-px-4 tw-py-1.5"
    [class.tw-border-green-400]="slideshowPlaying"
    [class.tw-bg-green-50]="slideshowPlaying">
    <span class="tw-text-sm tw-font-bold tw-text-gray-800">{{ convertToArabicNumbers(pageNumber) }}</span>
  </div>

  <!-- Speed selector -->
  <select [(ngModel)]="slideshowSpeed" (ngModelChange)="onSlideshowSpeedChange()"
    class="tw-text-xs tw-text-gray-500 tw-bg-white tw-border tw-border-gray-200 tw-rounded-full tw-px-2 tw-py-1 tw-shadow-sm tw-outline-none">
    <option [value]="1500">سريع</option>
    <option [value]="3000">متوسط</option>
    <option [value]="5000">بطيء</option>
  </select>

  <!-- Prev page (RTL: visually left = prev in mushaf) -->
  <button (click)="prevPage()" [disabled]="pageNumber <= 1"
    class="tw-flex tw-items-center tw-justify-center tw-w-8 tw-h-8 tw-rounded-full tw-bg-white tw-border tw-border-gray-200 tw-shadow-sm tw-transition-all hover:tw-bg-gray-50 hover:tw-shadow-md active:tw-scale-95 disabled:tw-opacity-30 disabled:tw-cursor-default">
    <svg xmlns="http://www.w3.org/2000/svg" class="tw-w-4 tw-h-4 tw-text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <!-- Quick Go To — icon button + upward panel -->
  <div class="goto-anchor" dir="rtl">
    <button (click)="goToOpen = !goToOpen"
      class="tw-flex tw-items-center tw-justify-center tw-w-8 tw-h-8 tw-rounded-full tw-shadow-sm tw-transition-all hover:tw-shadow-md active:tw-scale-95 tw-border"
      [class.tw-bg-gray-800]="goToOpen" [class.tw-border-gray-800]="goToOpen" [class.tw-text-white]="goToOpen"
      [class.tw-bg-white]="!goToOpen" [class.tw-border-gray-200]="!goToOpen" [class.tw-text-gray-600]="!goToOpen"
      title="الانتقال السريع">
      <svg xmlns="http://www.w3.org/2000/svg" class="tw-w-4 tw-h-4" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>

    <div *ngIf="goToOpen"
      class="goto-panel tw-bg-white tw-border tw-border-gray-200 tw-rounded-xl tw-shadow-xl tw-p-4"
      dir="rtl">

      <!-- Mode tabs -->
      <div class="tw-flex tw-gap-1 tw-mb-4 tw-bg-gray-100 tw-rounded-lg tw-p-1">
        <button *ngFor="let m of [{v:'page', l:'صفحة'}, {v:'sura', l:'سورة'}, {v:'aya', l:'آية'}]"
          (click)="setGoToMode($any(m.v))"
          class="tw-flex-1 tw-py-1.5 tw-text-xs tw-rounded-md tw-transition-all"
          [class.tw-bg-white]="goToMode === m.v" [class.tw-shadow-sm]="goToMode === m.v"
          [class.tw-font-semibold]="goToMode === m.v" [class.tw-text-gray-800]="goToMode === m.v"
          [class.tw-text-gray-400]="goToMode !== m.v">
          {{ m.l }}
        </button>
      </div>

      <!-- By page -->
      <div *ngIf="goToMode === 'page'" class="tw-flex tw-items-center tw-gap-2">
        <label class="tw-text-xs tw-text-gray-500 tw-w-16">رقم الصفحة</label>
        <input type="number" [(ngModel)]="goToPage" min="1" max="604"
          (keyup.enter)="onGoToSubmit()"
          class="tw-flex-1 tw-border tw-border-gray-300 tw-rounded-lg tw-px-3 tw-py-2 tw-text-sm tw-text-center tw-outline-none focus:tw-border-blue-400" />
      </div>

      <!-- By sura -->
      <div *ngIf="goToMode === 'sura'" class="tw-flex tw-items-center tw-gap-2">
        <label class="tw-text-xs tw-text-gray-500 tw-w-16">السورة</label>
        <select [(ngModel)]="goToSuraIndex" (change)="onGoToSubmit()"
          class="tw-flex-1 tw-border tw-border-gray-300 tw-rounded-lg tw-px-3 tw-py-2 tw-text-sm tw-outline-none focus:tw-border-blue-400">
          <option *ngFor="let s of suraList" [value]="s.index">{{ s.index }}. {{ s.name }}</option>
        </select>
      </div>

      <!-- By aya -->
      <div *ngIf="goToMode === 'aya'" class="tw-flex tw-flex-col tw-gap-2">
        <div class="tw-flex tw-items-center tw-gap-2">
          <label class="tw-text-xs tw-text-gray-500 tw-w-16">السورة</label>
          <select [(ngModel)]="goToSuraIndex" (ngModelChange)="goToAyaIndex = 1"
            class="tw-flex-1 tw-border tw-border-gray-300 tw-rounded-lg tw-px-3 tw-py-2 tw-text-sm tw-outline-none focus:tw-border-blue-400">
            <option *ngFor="let s of suraList" [value]="s.index">{{ s.index }}. {{ s.name }}</option>
          </select>

        </div>
        <div class="tw-flex tw-items-center tw-gap-2">
          <label class="tw-text-xs tw-text-gray-500 tw-w-16">رقم الآية</label>
          <input type="number" [(ngModel)]="goToAyaIndex" min="1" [max]="selectedSuraAyaCount"
            (keyup.enter)="onGoToSubmit()"
            class="tw-flex-1 tw-border tw-border-gray-300 tw-rounded-lg tw-px-3 tw-py-2 tw-text-sm tw-text-center tw-outline-none focus:tw-border-blue-400" />
          <span class="tw-text-xs tw-text-gray-400">/ {{ selectedSuraAyaCount }}</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="tw-flex tw-justify-start tw-gap-2 tw-mt-4">
        <button (click)="onGoToSubmit()"
          class="tw-px-5 tw-py-2 tw-text-sm tw-text-white tw-bg-gray-800 tw-rounded-lg hover:tw-bg-gray-700">
          انتقل
        </button>
        <button (click)="goToOpen = false"
          class="tw-px-4 tw-py-2 tw-text-sm tw-text-gray-500 tw-border tw-border-gray-200 tw-rounded-lg hover:tw-bg-gray-50">
          إغلاق
        </button>
      </div>
    </div>
  </div>

</div>

<p-contextMenu #menu [model]="contextMenuItems"></p-contextMenu>

<!-- Bookmark dialog -->
<div *ngIf="showBookmarkDialog"
  class="tw-fixed tw-inset-0 tw-z-50 tw-flex tw-items-center tw-justify-center"
  style="background: rgba(0,0,0,0.4);"
  (click)="showBookmarkDialog = false">
  <div class="tw-bg-white tw-rounded-2xl tw-shadow-xl tw-w-[420px] tw-p-6" dir="rtl"
    (click)="$event.stopPropagation()">
    <h3 class="tw-text-base tw-font-semibold tw-text-gray-800 tw-mb-4">حفظ الآية في المفضلة</h3>
    <div class="tw-mb-4" *ngIf="selectedAya">
      <p class="tw-text-xs tw-text-gray-400 tw-mb-1">الآية</p>
      <p class="tw-text-sm tw-leading-7 tw-text-gray-700 tw-bg-gray-50 tw-rounded-lg tw-p-3">
        {{ selectedAya.text }}
        <span class="tw-text-xs tw-text-gray-400 tw-block tw-mt-1">{{ selectedAya.suraName }} — {{ selectedAya.ayaNumber }}</span>
      </p>
    </div>
    <div class="tw-mb-5">
      <p class="tw-text-xs tw-text-gray-400 tw-mb-1">ملاحظاتك</p>
      <textarea [(ngModel)]="bookmarkNote" rows="4"
        class="tw-w-full tw-border tw-border-gray-300 tw-rounded-lg tw-p-3 tw-text-sm tw-resize-none tw-outline-none focus:tw-border-blue-400"
        placeholder="أضف ملاحظاتك على هذه الآية..."></textarea>
    </div>
    <div class="tw-flex tw-justify-start tw-gap-3">
      <button (click)="confirmBookmark()"
        class="tw-px-5 tw-py-2 tw-text-sm tw-text-white tw-bg-blue-600 tw-rounded-lg hover:tw-bg-blue-700">حفظ</button>
      <button (click)="showBookmarkDialog = false"
        class="tw-px-5 tw-py-2 tw-text-sm tw-text-gray-600 tw-border tw-border-gray-300 tw-rounded-lg hover:tw-bg-gray-50">إلغاء</button>
    </div>
  </div>
</div>
