<div dir="ltr">

    <div class="tw-grid tw-grid-cols-7 tw-gap-10">
        <div class="tw-col-span-2 tw-space-y-10">
            <div  *ngFor="let inp of rightMotashabehatSpans"
                class="tw-border-2 tw-border-green-700 tw-col-span-1 tw-p-4 tw-pt-0 tw-flex tw-items-center tw-flex-col tw-gap-y-4 tw-divide-y ">
                <!-- <h3 class="tw-mb-0 tw-pt-3 tw-font-medium">توجد في اكتر من ثلاث مواضع</h3> -->
                <span *ngFor="let mot of inp.moade3" class="tw-block tw-w-full tw-text-center tw-text-base tw-pt-4 tw-text-green-700">{{mot}})</span>
            </div>
          
        </div>
        <div class="tw-col-span-3 tw-border-4 tw-border-[#e4e4d0] tw-pt-5">
            <!-- images -->
            <app-quraan-images [images]="images"
            (motshabehat)="onMotshbehatGenerated($event)"
            
            ></app-quraan-images>
        </div>
        <div class="tw-col-span-2">
            <!-- details -->
            <div class="tw-col-span-2 tw-space-y-10">
                <div *ngFor="let inp of leftMotashabehatSpans"
                    class="tw-border-2 tw-border-green-700 tw-col-span-1 tw-p-4 tw-pt-0 tw-flex tw-items-center tw-flex-col tw-gap-y-4 tw-divide-y ">
                   <span *ngFor="let mot of inp.moade3" class="tw-block tw-w-full tw-text-center tw-text-base tw-pt-4 tw-text-green-700">
                    {{mot}})</span>
                </div>
            
            </div>
        </div>
    </div>
        <!-- info-colors -->
        <div class="flex-box tw-gap-x-7 tw-gap-y-3 tw-flex-wrap tw-justify-end tw-border tw-border-gray-300 tw-p-5 tw-mt-10">
           
            <div class="flex-box tw-gap-2">
                <span>ثلاث مواضع وسط الأية</span>
                <div class="tw-bg-blue-300 tw-w-4 tw-h-4"></div> <!-- light blue -->
            </div>
            <div class="flex-box tw-gap-2">
                <span>موضعين وسط الأية</span>
                <div class="tw-bg-green-300 tw-w-4 tw-h-4"></div> <!-- light green -->
            </div>
            <div class="flex-box tw-gap-2">
                <span>كلمة وحيدة وسط الأية</span>
                <div class="tw-bg-orange-400 tw-w-4 tw-h-4"></div>
            </div>
            <div class="flex-box tw-gap-2">
                <span>أكثر من أربع مواضع</span>
                <div class="tw-bg-purple-700 tw-w-4 tw-h-4"></div> <!-- purple -->
            </div>
            <div class="flex-box tw-gap-2">
                <span>أربع مواضع</span>
                <div class="tw-bg-yellow-300 tw-w-4 tw-h-4"></div>
            </div>
            <div class="flex-box tw-gap-2">
                <span>ثلاث مواضع</span>
                <div class="tw-bg-blue-700 tw-w-4 tw-h-4"></div>
            </div>
            <div class="flex-box tw-gap-2">
                <span>موضعين</span>
                <div class="tw-bg-green-700 tw-w-4 tw-h-4"></div>
            </div>
            <div class="flex-box tw-gap-2">
                <span>كلمة وحيدة بداية الأية</span>
                <div class="tw-bg-red-700 tw-w-4 tw-h-4"></div>
            </div>
        </div>
        
</div>
