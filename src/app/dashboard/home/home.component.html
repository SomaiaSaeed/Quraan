<div dir="ltr">

  <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-7 tw-gap-4">

    <!-- Right motashabehat panel -->
    <div class="tw-hidden md:tw-block md:tw-col-span-2 motashabehat-side" dir="rtl">
      <div *ngFor="let inp of rightMotashabehatSpans"
        class="motashabehat-box"
        [class.motashabehat-box--active]="hasHighlight(inp)"
        [style.top.px]="getAyaTop(inp)"
        [style.right.px]="getColOffset(inp)">
        <span *ngIf="hasHighlight(inp)" class="mot-indicator"></span>
        <span *ngFor="let sura of inp.mergedSuras"
          class="tw-block"
          [class.tw-text-green-700]="true">
          {{ sura.text }}
        </span>
      </div>
    </div>

    <!-- Quran page -->
    <div class="quran-wrapper md:tw-col-span-3">
      <!-- Left stack: only for left pages (even) — outer edge -->
      <div class="paper-stack paper-stack--left" *ngIf="!isRightPage"></div>
      <div class="tw-flex-1 tw-min-w-0 tw-border-4 tw-border-[#e4e4d0] tw-pt-5 tw-bg-[#fdf9ee] tw-border-double tw-overflow-hidden">
        <app-quraanImages [images]="images"
          (motshabehat)="onMotshbehatGenerated($event)"
          (onClick)="onAyaClick($event)"
          (pageNumberChange)="currentPage = $event">
        </app-quraanImages>
      </div>
      <!-- Right stack: only for right pages (odd) — outer edge -->
      <div class="paper-stack paper-stack--right" *ngIf="isRightPage"></div>
    </div>

    <!-- Left motashabehat panel -->
    <div class="tw-hidden md:tw-block md:tw-col-span-2 motashabehat-side" dir="rtl">
      <div *ngFor="let inp of leftMotashabehatSpans"
        class="motashabehat-box"
        [class.motashabehat-box--active]="hasHighlight(inp)"
        [style.top.px]="getAyaTop(inp)"
        [style.left.px]="getColOffset(inp)">
        <span *ngIf="hasHighlight(inp)" class="mot-indicator"></span>
        <span *ngFor="let sura of inp.mergedSuras"
          class="tw-block tw-text-green-700">
          {{ sura.text }}
        </span>
      </div>
    </div>

  </div>


</div>
