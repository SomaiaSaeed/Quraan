<div class="tw-bg-mainColor">
  <div class="tw-container tw-mx-auto tw-px-4 tw-py-3 tw-flex tw-items-center tw-justify-between tw-gap-4">

    <!-- Logo -->
    <h1 routerLink="/home"
      class="tw-font-quraanFont tw-text-2xl tw-text-white tw-drop-shadow-lg tw-mb-0 tw-cursor-pointer tw-select-none tw-whitespace-nowrap tw-flex-shrink-0">
      قرءان كريم
    </h1>

    <!-- Nav Links -->
    <nav class="tw-hidden md:tw-flex tw-items-center tw-gap-1 tw-flex-1 tw-justify-center">

      <a routerLink="/listen" routerLinkActive="nav-link-active"
        class="nav-link tw-text-white tw-text-sm tw-font-medium tw-px-3 tw-py-2 tw-rounded-md tw-no-underline tw-transition-all tw-whitespace-nowrap">
        ضبط الاستماع
      </a>

      <a routerLink="/search" routerLinkActive="nav-link-active"
        class="nav-link tw-text-white tw-text-sm tw-font-medium tw-px-3 tw-py-2 tw-rounded-md tw-no-underline tw-transition-all tw-whitespace-nowrap">
        إعدادت البحث
      </a>

      <a routerLink="/favorite" routerLinkActive="nav-link-active"
        class="nav-link tw-text-white tw-text-sm tw-font-medium tw-px-3 tw-py-2 tw-rounded-md tw-no-underline tw-transition-all tw-whitespace-nowrap">
        المفضلة
      </a>

      <a routerLink="/fehres" routerLinkActive="nav-link-active"
        class="nav-link tw-text-white tw-text-sm tw-font-medium tw-px-3 tw-py-2 tw-rounded-md tw-no-underline tw-transition-all tw-whitespace-nowrap">
        الفهرس
      </a>

      <!-- More dropdown -->
      <div class="tw-relative">
        <button (click)="toggleDropdown()"
          class="nav-link tw-flex tw-items-center tw-gap-1 tw-text-white tw-text-sm tw-font-medium tw-px-3 tw-py-2 tw-rounded-md tw-border-0 tw-bg-transparent tw-cursor-pointer tw-transition-all tw-whitespace-nowrap"
          [class.nav-link-active]="isOpenMenu">
          <span>المزيد</span>
          <mat-icon class="more-chevron tw-text-base tw-leading-none" style="font-size:18px;width:18px;height:18px;line-height:18px"
            [style.transform]="isOpenMenu ? 'rotate(180deg)' : 'rotate(0deg)'">
            expand_more
          </mat-icon>
        </button>

        <!-- Dropdown Panel -->
        <div *ngIf="isOpenMenu"
          class="dropdown-panel tw-absolute tw-top-full tw-mt-1 tw-bg-white tw-rounded-lg tw-shadow-lg tw-border tw-border-gray-100 tw-py-1 tw-z-50 tw-min-w-[160px]"
          [ngClass]="{'tw-right-0': true}">

          <button (click)="openSimilarities()"
            class="dropdown-item tw-w-full tw-flex tw-items-center tw-gap-2.5 tw-px-4 tw-py-2.5 tw-border-0 tw-bg-transparent tw-cursor-pointer tw-text-gray-700 tw-text-sm tw-text-right hover:tw-bg-secondColor hover:tw-text-mainColor tw-transition-colors tw-whitespace-nowrap">
            <mat-icon class="tw-text-mainColor tw-text-base" style="font-size:18px;width:18px;height:18px;line-height:18px">compare_arrows</mat-icon>
            عدد المتشابهات
          </button>

          <button
            class="dropdown-item tw-w-full tw-flex tw-items-center tw-gap-2.5 tw-px-4 tw-py-2.5 tw-border-0 tw-bg-transparent tw-cursor-pointer tw-text-gray-700 tw-text-sm tw-text-right hover:tw-bg-secondColor hover:tw-text-mainColor tw-transition-colors tw-whitespace-nowrap">
            <mat-icon class="tw-text-mainColor tw-text-base" style="font-size:18px;width:18px;height:18px;line-height:18px">menu_book</mat-icon>
            تفـسـير
          </button>

          <button (click)="openReads()"
            class="dropdown-item tw-w-full tw-flex tw-items-center tw-gap-2.5 tw-px-4 tw-py-2.5 tw-border-0 tw-bg-transparent tw-cursor-pointer tw-text-gray-700 tw-text-sm tw-text-right hover:tw-bg-secondColor hover:tw-text-mainColor tw-transition-colors tw-whitespace-nowrap">
            <mat-icon class="tw-text-mainColor tw-text-base" style="font-size:18px;width:18px;height:18px;line-height:18px">headset</mat-icon>
            القراء
          </button>

          <button (click)="openAlsajadat()"
            class="dropdown-item tw-w-full tw-flex tw-items-center tw-gap-2.5 tw-px-4 tw-py-2.5 tw-border-0 tw-bg-transparent tw-cursor-pointer tw-text-gray-700 tw-text-sm tw-text-right hover:tw-bg-secondColor hover:tw-text-mainColor tw-transition-colors tw-whitespace-nowrap">
            <mat-icon class="tw-text-mainColor tw-text-base" style="font-size:18px;width:18px;height:18px;line-height:18px">brightness_low</mat-icon>
            السجدات
          </button>

          <button (click)="openPrint()"
            class="dropdown-item tw-w-full tw-flex tw-items-center tw-gap-2.5 tw-px-4 tw-py-2.5 tw-border-0 tw-bg-transparent tw-cursor-pointer tw-text-gray-700 tw-text-sm tw-text-right hover:tw-bg-secondColor hover:tw-text-mainColor tw-transition-colors tw-whitespace-nowrap">
            <mat-icon class="tw-text-mainColor tw-text-base" style="font-size:18px;width:18px;height:18px;line-height:18px">print</mat-icon>
            طباعة
          </button>

        </div>
      </div>
    </nav>

    <!-- Search -->
    <app-main-search class="tw-flex-shrink-0"></app-main-search>

  </div>
</div>
