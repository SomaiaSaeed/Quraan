<form [formGroup]="form" class="tw-w-10/12 lg:tw-w-6/12 tw-m-auto tw-mt-8 tw-border tw-border-gray-200 tw-p-4">
	<div class="flex-c-b tw-gap-8 tw-flex-col md:tw-flex-row">
		<div class="tw-w-full md:tw-w-auto select-box tw-flex-1">
			<label class="tw-text-xs tw-font-medium tw-mb-2 tw-block">اسم السورة</label>
			<div class="flex-box tw-gap-2">
				<mat-form-field appearance="outline"
					class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0 tw-bg-white tw-rounded-md">
					<mat-label class="tw-text-sm">من</mat-label>
					<span matSuffix
						class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
					<!-- من سورة" -->
					<mat-select formControlName="suraFrom" (selectionChange)="updateAyaNumbers('from')">
						<mat-option  *ngFor="let sora of suraNames" [value]="sora">{{ sora }}</mat-option>
					</mat-select>
				</mat-form-field>

				<!-- إلى سورة -->
				<mat-form-field appearance="outline"
					class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0 tw-bg-white tw-rounded-md">
					<mat-label class="tw-text-sm">إلى</mat-label>
					<span matSuffix
						class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
					<mat-select formControlName="suraTo" (selectionChange)="updateAyaNumbers('to')">
						<mat-option  *ngFor="let sora of suraNames" [value]="sora">{{ sora }}</mat-option>
					</mat-select>
				</mat-form-field>
			</div>
		</div>
		<div class="tw-w-full md:tw-w-auto select-box tw-flex-1">
			<label class="tw-text-xs tw-font-medium tw-mb-2 tw-block">رقـم الاية</label>
			<div class="flex-box tw-gap-2">
				<!-- من اية -->
				<mat-form-field appearance="outline"
					class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0 tw-bg-white tw-rounded-md">
					<mat-label class="tw-text-sm">من</mat-label>
					<span matSuffix
						class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
					<mat-select formControlName="ayaFrom">
						<mat-option *ngFor="let ayah of ayaNumbersFrom" [value]="ayah" >{{ ayah }}</mat-option>
					</mat-select>
				</mat-form-field>
				<!-- إلى اية -->
				<mat-form-field appearance="outline"
					class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0 tw-bg-white tw-rounded-md">
					<mat-label class="tw-text-sm">إلى</mat-label>
					<span matSuffix
						class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
					<mat-select formControlName="ayaTo" (selectionChange)="generateAyaNumbers()">
						<mat-option *ngFor="let ayah of ayaNumbersTo" [value]="ayah">{{ ayah }}</mat-option>
					</mat-select>
				</mat-form-field>
			</div>
		</div>
	</div>
	<!-- advanced search -->
	<!--  *ngIf="isOpen" -->
	<div class="tw-mt-4 tw-border-t tw-border-gray-200 tw-pt-4 tw-space-y-3">
		<div class="flex-c-b tw-gap-8 tw-flex-col md:tw-flex-row">
			<div class="tw-w-full md:tw-w-auto select-box tw-flex-1">
				<label class="tw-text-xs tw-font-medium tw-mb-2 tw-block"> الجـزء</label>
				<div class="flex-box tw-gap-2">
					<mat-form-field appearance="outline"
						class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0  tw-rounded-md">
						<mat-label class="tw-text-sm">من</mat-label>
						<span matSuffix
							class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
						<!-- من سورة" -->
						<mat-select formControlName="JozFrom"> 
							<mat-option *ngFor="let Joz of uniqueJozNumbersList" [value]="Joz">{{Joz}}</mat-option>
						</mat-select>
					</mat-form-field>

					<!-- إلى سورة -->
					<mat-form-field appearance="outline"
						class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0  tw-rounded-md">
						<mat-label class="tw-text-sm">إلى</mat-label>
						<span matSuffix
							class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
						<!-- (selectionChange)="toPartFun($event)" -->
						<mat-select formControlName="JozTo"  (selectionChange)="getHezbNumbersInRange()">
							<mat-option *ngFor="let Joz of uniqueJozNumbersList" [value]="Joz">{{Joz}}</mat-option>
						</mat-select>
					</mat-form-field>
				</div>
			</div>
			<div class="tw-w-full md:tw-w-auto select-box tw-flex-1">
				<label class="tw-text-xs tw-font-medium tw-mb-2 tw-block"> الحـزب</label>
				<div class="flex-box tw-gap-2">
					<mat-form-field appearance="outline"
						class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0  tw-rounded-md">
						<mat-label class="tw-text-sm">من</mat-label>
						<span matSuffix
							class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
						<!-- من سورة" -->
						<mat-select formControlName="hezbFrom">
							<!-- {{ h.nOFHezb }} -->
							<mat-option *ngFor="let hezb of hezbList" [value]="hezb">{{hezb}}</mat-option>
						</mat-select>
					</mat-form-field>

					<!-- إلى سورة -->
					<mat-form-field appearance="outline"
						class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0  tw-rounded-md">
						<mat-label class="tw-text-sm">إلى</mat-label>
						<span matSuffix
							class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
						<mat-select formControlName="hezbTo" (selectionChange)="getRubbNumbersInRange()">
							<!-- {{ h.nOFHezb }} -->
							<mat-option *ngFor="let hezb of hezbList" [value]="hezb">{{hezb}}</mat-option>
						</mat-select>
					</mat-form-field>
				</div>
			</div>
		</div>
		<div class="flex-c-b tw-gap-8 tw-flex-col md:tw-flex-row">
			<div class="tw-w-full md:tw-w-auto select-box tw-flex-1">
				<label class="tw-text-xs tw-font-medium tw-mb-2 tw-block"> الربـع</label>
				<div class="flex-box tw-gap-2">
					<mat-form-field appearance="outline"
						class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0  tw-rounded-md">
						<mat-label class="tw-text-sm">من</mat-label>
						<span matSuffix
							class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
						<!-- من سورة" -->
						<mat-select formControlName="rubFrom">
							<mat-option *ngFor="let rub of rubList" [value]="rub">{{rub}}</mat-option>
						</mat-select>
					</mat-form-field>

					<!-- إلى سورة -->
					<mat-form-field appearance="outline"
						class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0  tw-rounded-md">
						<mat-label class="tw-text-sm">إلى</mat-label>
						<span matSuffix
							class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
						<mat-select formControlName="rubTo" (selectionChange)="getPagesNumbersInRange()">
							<mat-option *ngFor="let rub of rubList" [value]="rub">{{rub}}</mat-option>
						</mat-select>
					</mat-form-field>
				</div>
			</div>
			<div class="tw-w-full md:tw-w-auto select-box tw-flex-1">
				<label class="tw-text-xs tw-font-medium tw-mb-2 tw-block"> الصفحة</label>
				<div class="flex-box tw-gap-2">
					<mat-form-field appearance="outline"
						class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0  tw-rounded-md">
						<mat-label class="tw-text-sm">من</mat-label>
						<span matSuffix
							class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
						<!-- من سورة" -->
						<mat-select formControlName="pageFrom">
							<mat-option  *ngFor="let page of pagesList" [value]="page">{{page}}
							</mat-option>
						</mat-select>
					</mat-form-field>

					<!-- إلى سورة -->
					<mat-form-field appearance="outline"
						class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0  tw-rounded-md">
						<mat-label class="tw-text-sm">إلى</mat-label>
						<span matSuffix
							class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs"></span>
						<mat-select formControlName="pageTo" (selectionChange)="getAyatOfOages()">
							<mat-option *ngFor="let page of pagesList" [value]="page">{{page}}
							</mat-option>
						</mat-select>
					</mat-form-field>
				</div>
			</div>
		</div>
	</div>
	<!-- actions -->
	<div class="tw-mt-5">
		<!-- (click)="isOpen = !isOpen" -->
		<button type="submit" 
			class="tw-bg-secondColor tw-text-mainColor tw-font-bold hover:tw-text-white tw-h-10 tw-px-4 hover:tw-bg-[#AEC3AE] transition-du200 disabled:tw-bg-gray-200 disabled:tw-cursor-no-drop disabled:tw-text-gray-400">
			بحث متقدم
		</button>
		<span class="tw-mx-1"></span>
		<!-- (click)="rest()" -->
		<button type="submit"  (click)="resetForm()"
			class="tw-bg-secondColor tw-text-mainColor tw-font-bold hover:tw-text-white tw-h-10 tw-px-4 hover:tw-bg-[#AEC3AE] transition-du200 disabled:tw-bg-gray-200 disabled:tw-cursor-no-drop disabled:tw-text-gray-400">
			إعادة تعيين
		</button>
	</div>
</form>


 <!--  [data]="sorats" -->
<app-audio-player [data]="audioFiles"></app-audio-player>
