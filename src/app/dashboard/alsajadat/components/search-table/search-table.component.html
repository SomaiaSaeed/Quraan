<div dir="rtl">
	<div class="flex-c-b tw-mt-6">
		<span class="tw-font-bold tw-text-sm tw-block">عدد النتائج ({{ sajdat.length }})</span>
	</div>
	<div class="tw-overflow-auto tw-mt-6">
		<section class="tw-table tw-w-full tw-whitespace-nowrap">
			<header class="tw-table-row tw-bg-secondColor tw-sticky tw-top-0">
				<div
					class="tw-table-cell tw-text-gray-700 tw-font-bold tw-text-sm tw-px-6 tw-py-4 tw-text-right">
					الأيـة
				</div>
				<div
					class="tw-table-cell tw-text-gray-700 tw-font-bold tw-text-sm tw-p-4 tw-text-right">
					اسـم السورة
				</div>
				<div
					class="tw-table-cell tw-text-gray-700 tw-font-bold tw-text-sm tw-p-4 tw-text-right">
					الجزء
				</div>
				<div
					class="tw-table-cell tw-text-gray-700 tw-font-bold tw-text-sm tw-p-4 tw-text-right">
					رقـم الاية
				</div>
				<div
					class="tw-table-cell tw-text-gray-700 tw-font-bold tw-text-sm tw-p-4 tw-text-right">
					الصفحة
				</div>
			</header>

			<div
				*ngFor="let item of sajdat"
				class="tw-table-row tw-bg-white tw-w-full tw-cursor-pointer hover:tw-bg-gray-50 tw-transition-colors"
				(click)="goToPage(item.page)">

				<div class="tw-table-cell tw-border-b tw-border-gray-200 tw-px-6 tw-py-3">
					<div class="tw-flex tw-items-start tw-gap-2">
						<div class="tw-w-0.5 tw-min-h-[2.5rem] tw-bg-mainColor tw-rounded-md tw-shrink-0"></div>
						<p class="tw-mb-0 tw-text-sm tw-leading-relaxed tw-font-arabic">{{ item.ayaText }}</p>
					</div>
				</div>

				<div class="tw-table-cell tw-border-b tw-border-gray-200 tw-align-middle tw-px-4 tw-py-1">
					<span class="tw-text-sm tw-text-bgSTC">{{ item.sura }}</span>
				</div>

				<div class="tw-table-cell tw-border-b tw-border-gray-200 tw-align-middle tw-px-4 tw-py-1">
					<span class="tw-inline-flex tw-items-center tw-justify-center tw-w-7 tw-h-7 tw-border tw-border-gray-200 tw-text-sm tw-text-bgSTC">
						{{ toArabicNumber(item.juz) }}
					</span>
				</div>

				<div class="tw-table-cell tw-border-b tw-border-gray-200 tw-align-middle tw-px-4 tw-py-1">
					<span class="tw-inline-flex tw-items-center tw-justify-center tw-w-7 tw-h-7 tw-border tw-border-gray-200 tw-text-sm tw-text-bgSTC">
						{{ toArabicNumber(item.ayaNumber) }}
					</span>
				</div>

				<div class="tw-table-cell tw-border-b tw-border-gray-200 tw-align-middle tw-px-4 tw-py-1">
					<span class="tw-inline-flex tw-items-center tw-justify-center tw-px-3 tw-h-7 tw-rounded tw-bg-mainColor tw-text-white tw-text-xs tw-gap-1">
						<span>{{ toArabicNumber(item.page) }}</span>
						<span>↗</span>
					</span>
				</div>

			</div>
		</section>
	</div>
</div>
