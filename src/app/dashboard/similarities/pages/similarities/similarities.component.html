<form [formGroup]="form"
      (ngSubmit)="save()"
      class="tw-w-10/12 lg:tw-w-6/12 tw-m-auto tw-mt-8 tw-border tw-border-gray-200 tw-p-4">

    <div class="flex-c-b tw-gap-8 tw-flex-col md:tw-flex-row">

        <div class="tw-w-full md:tw-w-auto select-box tw-flex-1">

            <label class="tw-text-xs tw-font-medium tw-mb-2 tw-block">
                اسم السورة
            </label>

            <div class="flex-box tw-gap-2">

                <!-- عدد المتشابهات -->
                <mat-form-field appearance="outline"
                                class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0 tw-bg-white tw-rounded-md">

                    <mat-label class="tw-text-sm">
                        عدد المتشابهات
                    </mat-label>

                    <mat-select formControlName="similarCount">
                        <mat-option *ngFor="let num of similarNumbers" [value]="num">
                            {{ num }}
                        </mat-option>
                    </mat-select>

                    <span matSuffix
                          class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs">
                    </span>

                </mat-form-field>


                <!-- في كم سورة -->
                <mat-form-field appearance="outline"
                                class="tw-w-full tw-flex-1 tw-mt-4 sm:tw-mt-0 tw-pb-0 tw-bg-white tw-rounded-md">

                    <mat-label class="tw-text-sm">
                        في كم سورة
                    </mat-label>

                    <mat-select formControlName="suraCount">
                        <mat-option *ngFor="let num of suraNumbers" [value]="num">
                            {{ num }}
                        </mat-option>
                    </mat-select>

                    <span matSuffix
                          class="sfi sfi-arrow-down1 tw-text-gray-500 tw-font-medium tw-mt-[-5px] tw-block tw-text-xs">
                    </span>

                </mat-form-field>

            </div>

        </div>

    </div>

    <!-- actions -->
    <div class="tw-mt-5">

        <button type="submit"
                class="tw-bg-secondColor tw-text-mainColor tw-font-bold hover:tw-text-white tw-h-10 tw-px-4 hover:tw-bg-[#AEC3AE] transition-du200 disabled:tw-bg-gray-200 disabled:tw-cursor-no-drop disabled:tw-text-gray-400">
            حفظ
        </button>

        <span class="tw-mx-1"></span>

    </div>

</form>
